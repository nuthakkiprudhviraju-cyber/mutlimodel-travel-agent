services:
  db:
    image: postgres:16-alpine
    container_name: roamagent-db
    environment:
      POSTGRES_USER: roamagent
      POSTGRES_PASSWORD: roamagent_secure_pass
      POSTGRES_DB: roamagent_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roamagent -d roamagent_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roamagent-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://roamagent:roamagent_secure_pass@db:5432/roamagent_db
      - JWT_SECRET_KEY=tbs-roamagent-super-production-jwt-secret-key-replace-2026
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: roamagent-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
